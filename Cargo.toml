[package]
name = "nctui"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
repository = "https://github.com/xyxiie/nctui"
description = "Fast terminal UI that finds open Minecraft servers with a built-in scanner and nmap"

[dependencies]
crossterm = "0.28"
quick-xml = "0.37"
ratatui = "0.29"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"] }
ureq = "2"
